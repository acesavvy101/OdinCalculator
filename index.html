<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator!</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="container">   
        <div><h1>Calculator!</h1></div>

        <div id="calculatorContainer">
            <img id="calculatorBackground" src="calcImages/calcTemplate.png">

            <div id="buttonContainer">
                <div id="buttonFirstRow">
                <button class="buttons">3</button>
                <button class="buttons">3</button>
                <button class="buttons">3</button>
                <button class="operatorBtn">+</button>
                </div>
                <div id="buttonSecondRow">
                <button class="buttons">3</button>
                <button class="buttons">3</button>
                <button class="buttons">3</button>
                <button class="operatorBtn">-</button>
                </div>
                <div id="buttonThirdRow">
                <button class="buttons">3</button>
                <button class="buttons">3</button>
                <button class="buttons">3</button>
                <button class="operatorBtn">×</button>
                </div>
                <div id="buttonFourthRow">
                    <button class="buttons">3</button>
                    <button class="buttons">3</button>
                    <button class="buttons">3</button>
                    <button class="operatorBtn">÷</button>
                    </div>
                </div>
            </div>

        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
