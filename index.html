<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator!</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="container">   
        <div><h1>Calculator!</h1></div>
        <div id="calculatorContainer">
            <img id="calculatorBackground" src="calcImages/calcTemplate.png">
            <!-- display: overflow hidden max 11 digits of visible numbers. SOLU:SHRINK FONT-->
            <div id="displayContainer">
                <p id="displayNumber">30000000009</p>
            </div>

            <div id="buttonContainer">
                <div id="clearButton"><button id="clearBtn">Clear</button></div>
                <div id="buttonFirstRow">
                <button class="buttons">1</button>
                <button class="buttons">2</button>
                <button class="buttons">3</button>
                <button class="operatorBtn">+</button>
                </div>
                <div id="buttonSecondRow">
                <button class="buttons">4</button>
                <button class="buttons">5</button>
                <button class="buttons">6</button>
                <button class="operatorBtn">-</button>
                </div>
                <div id="buttonThirdRow">
                <button class="buttons">7</button>
                <button class="buttons">8</button>
                <button class="buttons">9</button>
                <button class="operatorBtn">×</button>
                </div>
                <div id="buttonFourthRow">
                <button class="buttons">.</button>
                <button class="buttons">0</button>
                <button class="buttons">=</button>
                <button class="operatorBtn">÷</button>
                </div>
                </div>
            </div>

        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
